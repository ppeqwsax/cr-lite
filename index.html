<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>皇城对决 · Royale Lite</title>
<meta name="description" content="轻量化联机皇室战争：8 张牌组、双路推塔、圣水对决，纯网页即点即玩。">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%91%91%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="app">

  <header class="hud">
    <div class="hud-side foe">
      <span class="crowns" id="crownFoe">0</span>
      <span class="hud-name" id="nameFoe">对手</span>
    </div>
    <div class="hud-clock">
      <div class="timer" id="timer">3:00</div>
      <div class="hud-phase" id="phaseLabel">常规时间</div>
      <div class="net-status hidden" id="netStatus"></div>
    </div>
    <div class="hud-side me">
      <span class="hud-name" id="nameMe">你</span>
      <span class="crowns" id="crownMe">0</span>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="arena" width="504" height="792"></canvas>
    <div class="overlay" id="overlay"></div>
    <div class="toast hidden" id="toast"></div>
  </div>

  <div class="handbar" id="handbar">
    <div class="elixir">
      <div class="elixir-track"><div class="elixir-fill" id="elixirFill"></div></div>
      <div class="elixir-num" id="elixirNum">5</div>
    </div>
    <div class="hand" id="hand"></div>
  </div>

  <footer class="foot">
    <span>8 张牌组 · 双路推塔 · 2:50 后双倍圣水</span>
  </footer>

</div>

<script src="js/data.js"></script>
<script src="js/sim.js"></script>
<script src="js/render.js"></script>
<script src="js/ai.js"></script>
<script src="js/net-config.js"></script>
<script src="js/net.js"></script>
<script src="js/p2p.js"></script>
<script src="js/netplay.js"></script>
<script src="js/main.js"></script>
</body>
</html>
